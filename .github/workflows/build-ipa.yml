name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild \
            -project Dosenjaeger.xcodeproj \
            -scheme Dosenjaeger \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|warning: .*isolated" build.log | head -80; tail -60 build.log; exit 1; }
          grep -c "warning:" build.log || true

      - name: IPA packen
        run: |
          APP=build/Build/Products/Release-iphoneos/Dosenjaeger.app
          test -d "$APP"
          # Sideloadly/Apple-ID-Signierung lehnen Nicht-ASCII-Namen ab.
          for KEY in CFBundleName CFBundleDisplayName CFBundleExecutable; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist" 2>/dev/null || true)
            echo "$KEY = $VALUE"
            if LC_ALL=C grep -q '[^ -~]' <<< "$VALUE"; then echo "::error::$KEY enthält Nicht-ASCII-Zeichen"; exit 1; fi
          done
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Dosenjaeger-unsigned.ipa Payload
          ls -lh Dosenjaeger-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Dosenjaeger-unsigned-ipa
          path: Dosenjaeger-unsigned.ipa

      - name: Vorabversion „latest“ aktualisieren (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dosenjaeger-unsigned.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Dosenjäger (aktueller Stand)" \
            --notes "Automatisch gebaut aus $GITHUB_SHA. Unsignierte IPA – mit Sideloadly/AltStore oder Xcode signieren."

      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Dosenjaeger-unsigned.ipa --title "Dosenjäger $GITHUB_REF_NAME" --notes "Unsignierte IPA – mit Sideloadly/AltStore oder eigenem Zertifikat signieren."
